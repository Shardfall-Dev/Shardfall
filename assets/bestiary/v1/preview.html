<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shardfall · Bestiary</title><style>*{box-sizing:border-box}body{margin:0;background:#171c20;color:#ede7d7;font:16px system-ui}main{max-width:1110px;margin:auto;padding:24px}h1{font:32px Georgia,serif}header{display:flex;flex-wrap:wrap;align-items:center;gap:18px}select,button{background:#2d363a;color:inherit;font:inherit;padding:6px;border:1px solid #627071;border-radius:4px}section{margin-top:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}figure{margin:0;background:#232d30;border:1px solid #435053;text-align:center}canvas{display:block;width:100%;image-rendering:pixelated}figcaption{padding:0 4px 12px}</style><main><header><h1>Shardfall bestiary</h1><label>Facing <select id="dir"><option value="0" >S</option><option value="1" selected>SW</option><option value="2" >W</option><option value="3" >NW</option><option value="4" >N</option><option value="5" >NE</option><option value="6" >E</option><option value="7" >SE</option></select></label><label>Action <select id="act"><option>Walk</option><option>Attack</option><option>Idle</option></select></label><button id="play">Pause</button></header><section></section></main><script>
const roster=["orc","ettin","troll","lizardman","gargoyle","earth_elemental","giant_spider","dire_wolf","harpy","slime","lich_lord"], cards=[],root=document.querySelector('section'),dir=document.querySelector('#dir'),act=document.querySelector('#act'),btn=document.querySelector('#play');
for(const id of roster){const f=document.createElement('figure'),c=document.createElement('canvas'),caption=document.createElement('figcaption'),img=new Image();c.width=c.height=160;caption.textContent=id.replaceAll('_',' ').replace(/\b\w/g,s=>s.toUpperCase());f.append(c,caption);root.append(f);img.onerror=()=>caption.textContent+=' · image unavailable';img.src=id+'.png';cards.push([c.getContext('2d'),img]);}
let running=true,elapsed=0,prev=performance.now();btn.onclick=()=>{running=!running;btn.textContent=running?'Pause':'Play'};act.onchange=()=>elapsed=0;
function draw(now){if(running)elapsed+=Math.min(100,now-prev);prev=now;let t=elapsed%450,a=elapsed%950,frame=act.value==='Idle'?1:act.value==='Attack'?(a<230?3:a<340?4:1):(t<125?0:t<225?1:t<350?2:1);
for(const [ctx,img] of cards){ctx.clearRect(0,0,160,160);if(img.complete&&img.naturalWidth)ctx.drawImage(img,160*frame,160*Number(dir.value),160,160,0,0,160,160)}requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script></html>
