# Publish the game on GitHub Pages every time main changes.
# The newest Shardfall_vX.Y.html becomes the site's front page (index.html); the sound and music it loads go beside it.
# One-time setup: repository Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the build
        run: |
          GAME=$(ls Shardfall_v*.html | grep -v _offline | sort -V | tail -n 1)
          echo "GAME=$GAME" >> "$GITHUB_ENV"
          node tests/rules.test.js "$GAME"
          node tests/magery.test.js "$GAME"
          if [ -f tests/wardrobe.test.js ]; then node tests/wardrobe.test.js "$GAME"; fi

      - name: Assemble the site
        run: |
          mkdir -p _site/assets/audio _site/assets/music/v1.0.0
          cp "$GAME" _site/index.html
          cp "$GAME" "_site/$GAME"
          cp -r assets/audio/web assets/audio/sfx assets/audio/manifest.json _site/assets/audio/
          cp -r assets/music/v1.0.0/MP3 _site/assets/music/v1.0.0/
          echo "Publishing $GAME"; du -sh _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
