<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shardfall Wardrobe Studio</title>
<style>body{background:#242521;color:#e3d6ba;font:15px Georgia,serif;margin:20px}h1{font-size:25px}select,button,input{background:#37372e;color:#eee0c7;padding:7px;border:1px solid #827250}label{display:inline-flex;flex-direction:column;margin:6px}main{display:flex;flex-wrap:wrap;gap:12px}section{border:1px solid #74644b;padding:12px;background:#302f28}#world{width:224px;height:200px}#world svg,#doll svg{width:100%;height:100%}#doll{width:240px;height:320px}#world svg{image-rendering:pixelated}button{margin:5px}small{display:block;color:#b9ac92}</style>
<h1>Shardfall · Medieval Wardrobe v1.0</h1><p>Procedural layered art preview. Same equipment and dyes on animated world sprite and resting paperdoll. Not final painted art.</p><div id="controls"></div><main><section><h2>World sprite</h2><div id="world"></div><small>112 × 100 native cell</small></section><section><h2>Paperdoll</h2><div id="doll"></div><small>384 × 512 scalable prototype</small></section></main><div><button id="png">Export world PNG atlas</button><button id="svg">Export world SVG atlas</button><button id="dollpng">Export paperdoll PNG</button></div><p id="status"></p>
<script type="module">
import {R,PRESETS,FACTIONS,frameSVG,atlasSVG,paperdollSVG} from './views.mjs';import {preset,METALS} from '../layered-armor-v1/armor-layers.mjs';
const q=s=>document.querySelector(s),c=q('#controls'),d={};function select(k,values,initial){const l=document.createElement('label'),s=document.createElement('select');l.textContent=k;for(const x of values)s.add(new Option(x||'None',x));s.value=initial;l.append(s);c.append(l);d[k]=s}
select('role',Object.keys(PRESETS),'blacksmith');select('faction',Object.keys(FACTIONS),'vespar');select('body',['male','female'],'male');select('direction',R.DIRECTIONS,'SE');select('action',Object.keys(R.ANIMATIONS),'walk');select('skin',Object.keys(R.SKIN),'fair');select('hair',Object.keys(R.HAIR),'brown');select('style',R.HAIRSTYLES,'short');select('beard',R.BEARDS,'none');select('armor',['','cloth','leather','studded','bone','ringmail','chain','plate','dragon'],'');select('material',METALS,'iron');select('weapon',R.WEAPONS,'unarmed');
function opts(){let o=Object.fromEntries(Object.entries(d).map(([k,s])=>[k,s.value]));return {...o,equip:o.armor?preset(o.armor,o.material):{},wardrobe:{role:o.role,faction:o.faction}}}
let last='',frame=-1;function draw(ms){let o=opts(),k=JSON.stringify(o),f=Math.floor(ms/120)%R.ANIMATIONS[o.action];if(last!==k){q('#doll').innerHTML=paperdollSVG(o);last=k;frame=-1}if(frame!==f){q('#world').innerHTML=frameSVG({...o,frame:f});frame=f}requestAnimationFrame(draw)}requestAnimationFrame(draw);
function save(blob,name){let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function handle(fn){return async()=>{try{await fn();q('#status').textContent='Export created'}catch(e){q('#status').textContent=e.message}}}
q('#png').onclick=handle(async()=>save(await R.svgToPNG(atlasSVG(opts())),'wardrobe-world.png'));q('#svg').onclick=handle(()=>save(new Blob([atlasSVG(opts())],{type:'image/svg+xml'}),'wardrobe-world.svg'));q('#dollpng').onclick=handle(async()=>save(await R.svgToPNG(paperdollSVG(opts())),'wardrobe-paperdoll.png'));
</script>
