<!doctype html><meta charset="utf-8"><title>Shardfall rig v2</title><style>body{background:#242724;color:#e0d6bc;font:15px system-ui;margin:28px}label{display:inline-flex;flex-direction:column;margin:8px}select,button{padding:7px;background:#373b36;color:#eee;border:1px solid #74766b}#view{width:336px;height:300px;background:#353a33}#view svg{width:100%;height:100%;image-rendering:pixelated}button{margin:8px}</style><h1>Classic human sprite rig v2 - prototype</h1><p>Procedural preview, not final painted art.</p><div id="controls"></div><div id="view"></div><button id="png">Export PNG atlas</button><button id="svg">Export SVG atlas</button><script type="module">import * as R from './classic-human-rig-v2.mjs';const groups={body:['male','female'],direction:R.DIRECTIONS,action:Object.keys(R.ANIMATIONS),weapon:R.WEAPONS,cloth:Object.keys(R.CLOTH),hair:Object.keys(R.HAIR),skin:Object.keys(R.SKIN),style:R.HAIRSTYLES,beard:R.BEARDS,outfit:['tunic','robe','apron','guard','leather'],shield:['false','true']},c=document.querySelector('#controls'),view=document.querySelector('#view');for(const [k,v] of Object.entries(groups)){let l=document.createElement('label'),s=document.createElement('select');l.textContent=k;s.name=k;for(const x of v){let o=document.createElement('option');o.textContent=x;o.value=x;s.append(o)}if(k==='direction')s.value='SE';if(k==='action')s.value='walk';l.append(s);c.append(l)}const opts=()=>{let o=Object.fromEntries([...c.querySelectorAll('select')].map(s=>[s.name,s.value]));o.shield=o.shield==='true';return o};function loop(ms){let o=opts();o.frame=Math.floor(ms/110)%R.ANIMATIONS[o.action];view.innerHTML=R.frameSVG(o);requestAnimationFrame(loop)}requestAnimationFrame(loop);function save(blob,ext){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='shardfall-'+opts().action+'-'+opts().weapon+'-v2.'+ext;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}document.querySelector('#png').onclick=async()=>save(await R.svgToPNG(R.atlasSVG(opts())),'png');document.querySelector('#svg').onclick=()=>save(new Blob([R.atlasSVG(opts())],{type:'image/svg+xml'}),'svg');</script>
