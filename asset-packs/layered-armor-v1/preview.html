<!doctype html><meta charset="utf-8"><title>Shardfall layered armor v1</title><style>body{background:#242724;color:#e0d6bc;font:15px system-ui;margin:20px}label{display:inline-flex;flex-direction:column;margin:6px}select,button{padding:7px;background:#373b36;color:#eee;border:1px solid #74766b}#view{width:336px;height:300px;background:#353a33}#view svg{width:100%;height:100%;image-rendering:pixelated}button{margin:8px}#slots{max-width:950px}</style><h1>Shardfall layered armor v1.0</h1><p>Articulated procedural artwork, not final painted sprites. Choose different pieces and materials independently.</p><div id="controls"></div><div id="view"></div><div id="slots"></div><button id="png">Export composite PNG atlas</button><button id="svg">Export composite SVG atlas</button><script type="module">import * as R from './classic-human-rig-armor-v1.mjs';import {DEFINITIONS,COLORS,SLOTS,METALS,preset} from './armor-layers.mjs';const q=s=>document.querySelector(s), mk=(parent,name,values)=>{let l=document.createElement('label'),s=document.createElement('select');l.textContent=name;for(const x of values)s.add(new Option(x||'None',x));l.append(s);parent.append(l);return s};const c=q('#controls'),d={};for(const [k,v] of Object.entries({body:['male','female'],direction:R.DIRECTIONS,action:Object.keys(R.ANIMATIONS),weapon:R.WEAPONS,cloth:Object.keys(R.CLOTH),hair:Object.keys(R.HAIR),skin:Object.keys(R.SKIN),style:R.HAIRSTYLES,beard:R.BEARDS}))d[k]=mk(c,k,v);d.action.value='walk';d.direction.value='SE';const f=mk(c,'Apply set',['','cloth','leather','studded','bone','ringmail','chain','plate','dragon']),m=mk(c,'Set metal',METALS),slots={};for(const slot of SLOTS){let row=document.createElement('div');q('#slots').append(row);const ids=Object.keys(DEFINITIONS).filter(k=>DEFINITIONS[k].slot===slot);slots[slot]=[mk(row,slot,['',...ids]),mk(row,'material',Object.keys(COLORS)),mk(row,'stud metal',METALS)];slots[slot][0].onchange=()=>{const def=DEFINITIONS[slots[slot][0].value];if(def)slots[slot][1].value=def.fixed||(def.primary==='hide'?'regular':def.primary==='wood'?'pine':'iron');};}function apply(){const set=preset(f.value,m.value);for(const [s,[id,mat,sec]] of Object.entries(slots)){id.value=set[s]?.id||'';mat.value=set[s]?.material||'iron';sec.value=set[s]?.sec||'iron';}}f.onchange=apply;m.onchange=apply;f.value='plate';apply();const opts=()=>({...Object.fromEntries(Object.entries(d).map(([k,s])=>[k,s.value])),equip:Object.fromEntries(Object.entries(slots).filter(([s,[id]])=>id.value).map(([s,[id,mat,sec]])=>[s,{id:id.value,material:mat.value,sec:sec.value}]))});function loop(ms){let o=opts();o.frame=Math.floor(ms/110)%R.ANIMATIONS[o.action];q('#view').innerHTML=R.frameSVG(o);requestAnimationFrame(loop)}requestAnimationFrame(loop);function save(blob,ext){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='shardfall-armor-v1-'+opts().action+'.'+ext;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}q('#png').onclick=async()=>save(await R.svgToPNG(R.atlasSVG(opts())),'png');q('#svg').onclick=()=>save(new Blob([R.atlasSVG(opts())],{type:'image/svg+xml'}),'svg');</script>
